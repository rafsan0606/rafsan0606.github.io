<!DOCTYPE html>
    <head>
        <title>Rock - Paper - Scissors</title>
        <link rel="stylesheet" href="./style.css">
    </head>
    <body>
        <div class="game-container">
            <div class="hero-container">
                <div class="col-1">
                </div>
                <div class="col-2">
                    <h2>Rock - Paper - Scissors</h2>
                </div>
                <div class="col-3">
                    <button onclick="resetScore()">Reset Score</button>
                </div>


            </div>

            <h4 id="result-text">Ready to play?</h4>
            <div class="move-container">
                <div class="move">
                    <img src="" alt="" id="player-pick">
                    <h5>You</h5>
                </div>
                <div class="move">
                    <img src="" alt="" id="computer-pick">
                    <h5>Computer</h5>
                </div>
            </div>
            <div class="pick-container">
                <button onclick="startGame('Rock')">
                    <img src="./assets/rock.png" alt="" class="pick-icon">
                    Rock</button>
                <button onclick="startGame('Paper')">
                    <img src="./assets/paper.png" alt="" class="pick-icon">
                    Paper</button>
                <button onclick="startGame('Scissors')">
                    <img src="./assets/scissors.png" alt="" class="pick-icon">
                    Scissors</button>
            </div>
            <h5>Pick a move</h5>

            <div class="score-container">
            <div class="score">
                <h5>Wins: <span id="wins"></span></h5>
                <h5>Losses: <span id="losses"></span></h5>
                <h5>Draw: <span id="draw"></span></h5>
            </div>
            </div>
        </div>


        <script src="./script.js"></script>
    </body>
</html>
