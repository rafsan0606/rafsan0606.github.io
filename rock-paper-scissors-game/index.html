<!DOCTYPE html>
    <head>
        <title>Rock - Paper - Scissors</title>
        <link rel="stylesheet" href="./style.css">
    </head>
    <body>
        <div class="game-container">
            <div class="hero-container">
                <div class="col-1">
                </div>
                <div class="col-2">
                    <h2>Rock - Paper - Scissors</h2>
                </div>
                <div class="col-3">
                    <button onclick="resetScore()" class="reset-button">
                        <img src="./assets/reload.png" alt="">Reset</button>
                </div>
            </div>

            <h4 id="result-text" class="heading">Ready to play?</h4>
            <div class="move-container">
                <div class="move">
                    <img src="" alt="" id="player-pick" class="show-picked-icon">
                    <h5>You</h5>
                </div>
                <div class="vs-container">
                    <h2>VS</h2>
                </div>
                <div class="move">
                    <img src="" alt="" id="computer-pick" class="show-picked-icon">
                    <h5>Computer</h5>
                </div>
            </div>

            <div class="pick-container">
                <button onclick="startGame('Rock')" class="pick-button">
                    <img src="./assets/Rock.png" alt="" class="pick-icon">
                    Rock</button>
                <button onclick="startGame('Paper')" class="pick-button">
                    <img src="./assets/Paper.png" alt="" class="pick-icon">
                    Paper</button>
                <button onclick="startGame('Scissors')" class="pick-button">
                    <img src="./assets/Scissors.png" alt="" class="pick-icon">
                    Scissors</button>

            </div>

            <h5 class="heading">Pick a move</h5>

            <div class="score-container">
                <h5 class="heading">Socreboard</h5>
                <div class="score">
                    <table>
                        <thead>
                            <tr>
                                <th>Wins</th>
                                <th>Losses</th>
                                <th>Draw</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td><span id="wins"></span></td>
                                <td><span id="losses"></span></td>
                                <td><span id="draw"></span></td>
                            </tr>
                        </tbody>
                    </table>

                </div>
            </div>

        </div>


        <script src="./script.js"></script>
    </body>
</html>
